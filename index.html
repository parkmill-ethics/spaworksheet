<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서양 고대 윤리 사상 마스터 챌린지</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Myeongjo:wght@700;800&family=Black+Han+Sans&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0b1120; color: #f8fafc; }
        .title-font { font-family: 'Black Han Sans', sans-serif; }
        .myeongjo-font { font-family: 'Nanum Myeongjo', serif; }
        .keep-all { word-break: keep-all; }
        
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.5); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.8); }

        .slide-enter { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-5 md:p-8">

    <main class="w-full max-w-4xl bg-slate-900/95 border border-slate-800 rounded-3xl shadow-2xl p-5 sm:p-7 md:p-10 flex flex-col justify-between min-h-[720px] relative backdrop-blur-md">
        
        <!-- 상단 헤더 및 글로벌 인디케이터 -->
        <header class="border-b border-slate-800 pb-4 mb-4 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <span class="text-3xl filter drop-shadow">🏛️</span>
                <div>
                    <h1 class="title-font text-xl sm:text-2xl text-amber-400 tracking-wider">서양 윤리 사상 4대 마스터</h1>
                    <p class="text-xs text-slate-400 hidden sm:block">소피스트 · 소크라테스 · 플라톤 · 아리스토텔레스</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="score-badge" class="px-3.5 py-1.5 bg-slate-800 border border-slate-700 text-xs sm:text-sm font-bold text-amber-300 rounded-xl shadow-inner">
                    점수: 0 / 100점
                </span>
                <span id="part-indicator" class="px-3.5 py-1.5 bg-amber-500/10 border border-amber-500/30 text-xs sm:text-sm font-bold text-amber-400 rounded-xl">
                    준비
                </span>
            </div>
        </header>

        <!-- 파트 네비게이션 프로그레스 바 -->
        <nav id="part-nav" class="grid grid-cols-4 gap-2 mb-4">
            <div id="step-tab-0" class="p-2 rounded-xl border border-slate-800 bg-slate-950 text-center transition-all opacity-40">
                <span class="block text-[11px] font-bold text-slate-400">PART 1</span>
                <span class="block text-xs font-black text-slate-200 truncate">윤리적 상대주의</span>
            </div>
            <div id="step-tab-1" class="p-2 rounded-xl border border-slate-800 bg-slate-950 text-center transition-all opacity-40">
                <span class="block text-[11px] font-bold text-slate-400">PART 2</span>
                <span class="block text-xs font-black text-slate-200 truncate">소크라테스</span>
            </div>
            <div id="step-tab-2" class="p-2 rounded-xl border border-slate-800 bg-slate-950 text-center transition-all opacity-40">
                <span class="block text-[11px] font-bold text-slate-400">PART 3</span>
                <span class="block text-xs font-black text-slate-200 truncate">플라톤</span>
            </div>
            <div id="step-tab-3" class="p-2 rounded-xl border border-slate-800 bg-slate-950 text-center transition-all opacity-40">
                <span class="block text-[11px] font-bold text-slate-400">PART 4</span>
                <span class="block text-xs font-black text-slate-200 truncate">아리스토텔레스</span>
            </div>
        </nav>

        <!-- 중앙 동적 렌더링 뷰 영역 -->
        <section id="quiz-container" class="flex-1 flex flex-col justify-center slide-enter my-2">
            <!-- 자바스크립트로 동적 출력 -->
        </section>

        <!-- 하단 조작 컨트롤러 -->
        <footer id="footer-nav" class="pt-4 border-t border-slate-800 flex items-center justify-between gap-3 mt-4">
            <button id="prev-btn" onclick="goToPrevStep()" class="hidden px-5 py-2.5 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-slate-300 hover:text-white font-bold rounded-xl transition-all text-sm flex items-center gap-1.5">
                <span>⬅️</span> <span>이전 단계</span>
            </button>
            <div class="flex-1"></div>
            <button id="action-btn" onclick="handleAction()" class="px-7 py-3 bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-black rounded-xl transition-all shadow-lg shadow-amber-500/20 text-sm sm:text-base flex items-center gap-2">
                <span>도전 시작하기</span> <span>➔</span>
            </button>
        </footer>

    </main>

    <!-- 모달: 미입력 안내 모달 -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
            <div class="text-4xl mb-3">⚠️</div>
            <h3 class="text-lg font-black text-white mb-2" id="modal-title">확인 안내</h3>
            <p class="text-sm text-slate-300 mb-6 keep-all" id="modal-desc">답안을 선택하거나 입력하지 않은 문제가 있습니다. 그래도 정답을 확인하시겠습니까?</p>
            <div class="flex gap-2.5">
                <button onclick="closeModal(false)" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-slate-300 text-sm transition-all">다시 풀기</button>
                <button onclick="closeModal(true)" class="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 font-black text-slate-950 text-sm transition-all">그대로 제출</button>
            </div>
        </div>
    </div>

    <!-- 토스트 알림 컴포넌트 -->
    <div id="toast-box" class="fixed bottom-6 px-5 py-3 rounded-2xl bg-slate-800/95 border border-slate-700 text-slate-100 text-xs sm:text-sm font-bold shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center gap-2">
        <span id="toast-icon">✨</span>
        <span id="toast-msg">복사되었습니다.</span>
    </div>

    <script>
        // 학습지 4 & 학습지 5 기반 4파트 12문항 데이터베이스
        const quizParts = [
            {
                partId: 1,
                scholar: "소피스트 (프로타고라스, 고르기아스, 트라시마코스)",
                title: "PART 1. 윤리적 상대주의와 소피스트",
                description: "경험주의·상대주의·실용주의와 보편적 진리 회의론",
                ox: {
                    title: "[OX 문제] 소피스트의 진리관과 경험주의",

                    options: ["O", "X"],

                },
                choice: {
                    title: "[객관식 문제] 소피스트 사상의 본질",
                    points: 10,
                    question: "소피스트들의 윤리적 상대주의 및 실용주의 사상에 대한 설명으로 옳은 것은?",
                    options: [
                        "정의란 국가 전체 구성원 모두의 화합과 공익을 뜻한다고 보았다.",
                        "도덕 판단의 기준은 시대와 문화, 개인에 따라 달라질 수 없다고 보았다.",
                        "절대적 진리가 없으므로 세속적 가치 획득과 현실적 실용성을 중시하였다.",
                        "덕에 대한 참된 지식을 갖추면 누구나 필연적으로 도덕적 실천을 행한다고 보았다."

                    answers: ["만물의 척도", "만물의척도"],
                    explanation: "프로타고라스는 '인간은 만물의 척도이다'라고 주장하여, 사람마다 가치판단의 기준이 다르므로 절대적인 옳고 그름의 기준도 없다고 설명했습니다."

                    title: "[주관식 문제] 소크라테스의 대화법",

                    answers: ["산파술", "문답법", "산파법"],

                description: "이분법적 세계관·영혼 삼분설·4주덕·상기설·철인정치",

                    options: ["O", "X"],
                    answer: "X",
                    explanation: "절제는 '지배받아야 할 부분이 지배할 부분에 복종하는 것'으로, 영혼의 세 부분(이성·기개·욕구) 및 국가의 세 계급(통치자·방위자·생산자) 모두가 공통으로 갖추어야 할 덕입니다."

                    explanation: "플라톤에게 정의란 영혼의 세 부분(이성, 기개, 욕구)이 각자 지혜, 용기, 절제의 덕을 발휘하며 서로 참견하지 않고 조화를 이루는 상태입니다."

            const part = quizParts[partIdx];
            const curAns = userProgress[partIdx];
            let partScore = 0;

            if (curAns.ox === part.ox.answer) {
                partScore += part.ox.points;
            }
            if (curAns.choice === part.choice.answer) {
                partScore += part.choice.points;
            }
            if (curAns.subjective) {
                const cleanInput = curAns.subjective.replace(/\s+/g, '').toLowerCase();
                const isMatch = part.subjective.answers.some(ans => ans.replace(/\s+/g, '').toLowerCase() === cleanInput);
                if (isMatch) {
                    partScore += part.subjective.points;
                }
            }

            curAns.earnedScore = partScore;
            curAns.isReviewed = true;
        }

                currentScreen = "quiz";
                currentPartIdx = 0;
                render();
            } else if (currentScreen === "quiz") {
                const curAns = userProgress[currentPartIdx];
                const isUnanswered = (curAns.ox === null || curAns.choice === null || !curAns.subjective.trim());

                if (isUnanswered) {
                    openModal(
                        "미답변 문항 안내",
                        "선택하지 않거나 입력하지 않은 문항이 있습니다. 그래도 채점하고 해설을 확인하시겠습니까?",
                        () => {
                            calculatePartScore(currentPartIdx);
                            currentScreen = "review";
                            render();
                        }
                    );
                    return;
                }

                calculatePartScore(currentPartIdx);
                currentScreen = "review";
                render();
            } else if (currentScreen === "review") {
                if (currentPartIdx < quizParts.length - 1) {
                    currentPartIdx++;
                    // 다음 파트가 이미 풀린 상태가 아니면 퀴즈 모드로, 이미 검토 완료되었으면 퀴즈 모드 유지
                    currentScreen = "quiz";
                    render();
                } else {
                    currentScreen = "result";
                    render();
                }
            } else if (currentScreen === "result") {
                // 전체 초기화
                for (let i = 0; i < 4; i++) {
                    userProgress[i] = { ox: null, choice: null, subjective: "", isReviewed: false, earnedScore: 0 };
                }
                currentScreen = "start";
                currentPartIdx = 0;
                showToast("새로운 도전이 시작되었습니다!", "🚀");
                render();
            }
        }

        function goToPrevStep() {
            if (currentScreen === "quiz") {
                if (currentPartIdx === 0) {
                    currentScreen = "start";
                } else {
                    // 이전 파트의 검토 화면으로 이동
                    currentPartIdx--;
                    currentScreen = "review";
                }
                render();
            } else if (currentScreen === "review") {
                // 현재 파트의 문제 풀이 화면으로 돌아가기 (답 수정 가능)
                currentScreen = "quiz";
                render();
            } else if (currentScreen === "result") {
                // 마지막 4파트 검토 화면으로 돌아가기
                currentPartIdx = 3;
                currentScreen = "review";
                render();
            }
        }

        function openModal(title, desc, onConfirm) {
            const modal = document.getElementById("custom-modal");
            const modalTitle = document.getElementById("modal-title");
            const modalDesc = document.getElementById("modal-desc");
            
            modalTitle.innerText = title;
            modalDesc.innerText = desc;
            pendingNextAction = onConfirm;
            modal.classList.remove("hidden");
        }

        function closeModal(proceed) {
            const modal = document.getElementById("custom-modal");
            modal.classList.add("hidden");
            if (proceed && typeof pendingNextAction === 'function') {
                pendingNextAction();
            }
            pendingNextAction = null;
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
